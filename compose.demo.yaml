services:
  prometheus:
    volumes:
      - ./generated/demo/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./secrets/synthetic.metrics:/run/secrets/synthetic.metrics:ro
  alloy:
    volumes:
      - ./generated/demo/config.alloy:/etc/alloy/config.alloy:ro
  gateway:
    volumes:
      - ./generated/demo/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/synthetic.htpasswd:/etc/nginx/auth/synthetic.htpasswd:ro
  registry:
    volumes:
      - ./generated/demo/services.json:/registry/services.json:ro
  synthetic:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: [python, synthetic.py]
    networks: [backend]
    volumes:
      - ./secrets/synthetic.metrics:/secrets/synthetic.metrics:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
