    }
    location = /synthetic-test {
      limit_except POST { deny all; }
      auth_basic "Synthetic test";
      auth_basic_user_file /etc/nginx/auth/synthetic.htpasswd;
      limit_req zone=ingestion burst=10 nodelay;
      proxy_set_header Authorization "";
      proxy_pass http://diddi-observe-synthetic-1:8000/exercise;
    }
    location /otlp/ { return 404; }
    location / {
      proxy_pass http://diddi-observe-grafana-1:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
