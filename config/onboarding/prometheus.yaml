  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: diddi-observe-blackbox-1:9115
- job_name: service-diddipay
  scheme: http
  metrics_path: /internal/metrics
  sample_limit: 20000
  authorization:
    credentials_file: /run/secrets/diddipay.metrics
  static_configs:
  - targets:
