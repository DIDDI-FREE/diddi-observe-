apiVersion: 1
contactPoints:
- orgId: 1
  name: local-only
  receivers:
  - uid: local-audit-sink
    type: webhook
    settings:
      url: http://registry:9108/alerts
      httpMethod: POST
policies:
- orgId: 1
  receiver: local-only
  group_by:
  - grafana_folder
  - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
