events { worker_connections 512; }
http {
  server_tokens off;
  access_log off;
  limit_req_zone $binary_remote_addr zone=ingestion:10m rate=20r/s;
  client_max_body_size 4m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 10s;
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    location = /gateway-health { return 200 'ok'; }

    location = /otlp/synthetic/v1/traces {
      limit_except POST { deny all; }
      auth_basic "DiddiObserve ingestion";
      auth_basic_user_file /etc/nginx/auth/synthetic.htpasswd;
      limit_req zone=ingestion burst=40 nodelay;
      proxy_pass http://alloy:4415/v1/traces;
      proxy_set_header Authorization "";
    }

    location = /otlp/synthetic/v1/logs {
      limit_except POST { deny all; }
      auth_basic "DiddiObserve ingestion";
      auth_basic_user_file /etc/nginx/auth/synthetic.htpasswd;
      limit_req zone=ingestion burst=40 nodelay;
      proxy_pass http://alloy:4415/v1/logs;
      proxy_set_header Authorization "";
    }
    location = /synthetic-test {
      limit_except POST { deny all; }
      auth_basic "Synthetic test";
      auth_basic_user_file /etc/nginx/auth/synthetic.htpasswd;
      limit_req zone=ingestion burst=10 nodelay;
      proxy_set_header Authorization "";
      proxy_pass http://synthetic:8000/exercise;
    }
    location /otlp/ { return 404; }
    location / {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
